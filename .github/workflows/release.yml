name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-<suffix> for a pre-release) builds the
# container image for linux/amd64 and linux/arm64, publishes it to
# ghcr.io/<owner>/<repo> as a single multi-arch image, and creates the GitHub
# release with generated release notes.
#
#   vX.Y.Z          -> :X.Y.Z, :X.Y and :latest
#   vX.Y.Z-<suffix> -> :X.Y.Z-<suffix> only (marked as a pre-release)

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$' <<< "$version"; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not a valid version. Use vX.Y.Z or vX.Y.Z-<suffix>."
            exit 1
          fi

          # The binary reports PROXY_VERSION (INFO proxy_version), so it must
          # match the tag. A pre-release reports its final version.
          proxy_version="$(sed -n 's/^#define PROXY_VERSION "\(.*\)"$/\1/p' src/proxy.h)"
          if [[ "$proxy_version" != "${version%%-*}" ]]; then
            echo "::error file=src/proxy.h::PROXY_VERSION is '${proxy_version}' but the tag is '${GITHUB_REF_NAME}'. Bump PROXY_VERSION before tagging."
            exit 1
          fi

          {
            echo "version=${version}"
            echo "prerelease=$([[ "$version" == *-* ]] && echo true || echo false)"
            # Registry refs must be lowercase; $GITHUB_REPOSITORY may not be.
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } | tee -a "$GITHUB_OUTPUT"

  # Build each architecture on a native runner (no QEMU emulation) and push it
  # by digest; the publish job tags the combined multi-arch image.
  build:
    name: Build ${{ matrix.platform }}
    needs: [prepare]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sanitize platform for artifact name
        id: prep
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "pair=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # Labels only; tags are applied to the manifest list in the publish job.
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Inline provenance is incompatible with push-by-digest.
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Smoke test image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # Fail if the binary is missing or any shared library doesn't resolve.
          docker run --rm --platform "$PLATFORM" "${IMAGE}@${DIGEST}" \
            sh -c 'ldd /usr/local/bin/valkey-proxy && ! ldd /usr/local/bin/valkey-proxy | grep -q "not found"'

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.prep.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-arch image
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Put the OCI annotations (source, description, license, ...) on the
          # manifest list so ghcr.io links the package to this repository.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          # Pre-releases get only {{version}}; :X.Y and :latest are stable-only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create "${args[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"

  release:
    name: Create GitHub release
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      IMAGE: ${{ needs.prepare.outputs.image }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - name: Create release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, leaving it unchanged."
            exit 0
          fi

          cat > notes.md <<EOF
          ## Container image

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Platforms: \`linux/amd64\`, \`linux/arm64\`

          EOF

          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          # The generated "What's Changed" notes are appended after notes.md.
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
