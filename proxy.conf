# ── cluster entry node ──────────────────────────────────────────────────
# proxy connects to this node on startup, sends CLUSTER NODES to discover
# the full cluster topology
# IPv4 address or DNS hostname (resolved again on each new connection).
server-ip    192.168.1.100
server-port  6379

# ── cluster topology refresh ────────────────────────────────────────────
# how often (ms) the proxy re-runs CLUSTER NODES in the background to pick
# up node additions, promoted replicas, and failed-but-unpromoted masters
# without a restart. 0 disables periodic refresh (topology is only ever
# fetched once, at startup).
# default: 500
cluster-refresh-interval-ms  500

# once a master is missing from discovery (or shows fail) with nobody
# having taken over its slots, how long (ms) to keep its idle connections
# around before releasing them. Only relevant when the refresh above is on.
# default: 10000
cluster-node-fail-grace-ms  10000

# connect timeout (ms) used for backend connections made *after* startup:
# worker-thread pool (re)connects (e.g. reconnecting to a promoted replica)
# and the periodic refresh's own probes. Kept short on purpose -- unlike the
# one-shot startup discovery's fixed 5s timeout, these run on a worker
# thread or block a refresh cycle, so a momentarily-unreachable node
# shouldn't be allowed to stall either for seconds. Must be positive.
# default: 1000
backend-connect-timeout-ms  1000

# ── client listener ─────────────────────────────────────────────────────
bind  192.168.2.100
port  7777

# ── max connections ─────────────────────────────────────────────────────
# process-wide fd budget shared by client connections and backend pool
# connections (client sockets + backend pool connections + listener(s)
# must all fit under this number). Raising it also requires the OS-level
# 'ulimit -n' for this process to be at least this high; the proxy tries
# to raise its own soft limit at startup and prints a warning if it can't.
# default: 4000
max-connection  4000

# ── max multi-key payload ───────────────────────────────────────────────
# largest command (bytes) the proxy will hold in memory in full before
# forwarding it: multi-key fan-out commands (MGET, MSET, DEL, EXISTS, ...),
# blocking commands and AUTH. The buffer grows by doubling from 4KB, and a
# command that would need it to grow past this is answered with
# "-ERR command too large". Must be positive.
# default: 67108864 (64MB)
max-multikey-payload  67108864

# ── worker threads ──────────────────────────────────────────────────────
# each worker thread maintains its own independent set of connection pools
# default: 1
worker-thread-no  1

# ── default database ────────────────────────────────────────────────────
# proxy sends SELECT <db> on every new backend connection (skipped when
# db=0), so all clients work in this one database. A client SELECT is
# accepted only for this same index (a no-op); any other index is
# rejected with "-ERR DB index is out of range". A non-zero db needs a
# backend that supports multiple databases in cluster mode (Valkey 9.0+,
# cluster-databases > db).
# default: 0
db  0

# ── backend multiplexing (shared connection pool) ───────────────────────
# yes: single-key commands (GET, SET, HGET, ...) and multi-key fan-out
# commands (MGET, MSET, DEL, EXISTS, ...) share a fixed set of connections
# per node instead of checking one out per command, and a client's
# pipelined commands are sent concurrently; replies still come back to the
# client in command order. no: one command in flight per client, each on a
# connection of its own from the normal pool.
# default: yes
backend-multiplexing  yes
# shared connections per node (and per db, per worker thread), all opened
# at startup. A key's commands always use the same one of them, so this is
# fixed: changing it needs a restart.
# default: 4
shared-connection-per-node  4
# most commands one client may have in flight before the proxy stops
# reading more from it
# default: 256
max-pipeline-inflight  256

# ── normal connection pool ──────────────────────────────────────────────
# used for the vast majority of read/write commands (GET, SET, HGET, etc.)
# -- with backend-multiplexing on, only for the rest: keyless commands,
# HELP subcommands, same-slot multi-key commands like EVAL, and commands
# too big to buffer
# default: min=2, max=20
min-normal-connection  2
max-normal-connection  20

# ── blocking connection pool ────────────────────────────────────────────
# used for blocking commands (BLPOP, BRPOP, BZPOPMIN, etc.)
# connections are kept in blocking mode
# default: min=2, max=10
min-blocking-connection  2
max-blocking-connection  10

# ── subscription connection pool ────────────────────────────────────────
# used for pub/sub commands (SUBSCRIBE, PSUBSCRIBE, etc.)
# connection is pinned to the client until all subscriptions are cancelled
# default: min=0 (on-demand), max=10
min-subscription-connection  0
max-subscription-connection  10

# ── transaction connection pool ─────────────────────────────────────────
# used for transactions (MULTI, EXEC, DISCARD, WATCH, UNWATCH)
# a connection is pinned to the client from its first WATCH or queued
# command until EXEC, DISCARD or UNWATCH; when all are in use, further
# transactions wait for one
# default: min=0 (on-demand), max=10
min-transaction-connection  0
max-transaction-connection  10
# most bytes of queued commands a transaction keeps so it can be replayed on
# the new node when its slot has moved (-MOVED); 0 disables replay, and the
# -MOVED is returned to the client
# default: 1048576
transaction-replay-buffer-size  1048576

# ── ACL connection pool ─────────────────────────────────────────────────
# used for access control commands (ACL, AUTH)
# default: min=0 (on-demand), max=10
min-acl-connection  0
max-acl-connection  10

# ── reported server identity ────────────────────────────────────────────
# by default HELLO and INFO report what the backends say: the lowest
# version across the masters, role master, and the modules loaded on every
# master, read at startup and again after each topology change (an
# in-place upgrade or module load that leaves the topology as it was isn't
# picked up until the next change or a restart).
# These override them, e.g. when a client turns features on or off
# by version. reported-version also applies to INFO server, and
# reported-role to INFO replication.
# reported-modules is a comma-separated list of name or name:ver, or none
# for an empty list. Each value is one word: no spaces, also not after the
# commas.
# default: unset (report the backends' values)
# reported-version  8.0.2
# reported-role     master
# reported-modules  search:10002,json

# ── Unix domain socket listener (optional) ──────────────────────────────
# clients connect with: redis-cli -s /tmp/valkey-proxy.sock
# comment out to disable
# unix-socket  /tmp/valkey-proxy.sock

# ── TLS for client connections (proxy ↔ client) ──────────────────────────
# backend connections (proxy ↔ Valkey nodes) remain plain TCP
# disable TLS build with: make valkey-proxy NO_TLS=1
# default: disabled
tls-enabled  no
# tls-cert  /etc/ssl/certs/proxy.crt
# tls-key   /etc/ssl/private/proxy.key
